<style>
.github-pr-preview-diff { --github-diff-addition-bg: #dafbe1; --github-diff-addition-fg: #1a7f37; --github-diff-removal-bg: #ffebe9; --github-diff-removal-fg: #cf222e; --github-diff-hunk-bg: #ddf4ff; --github-diff-hunk-fg: #0969da; }
[data-theme="dark"] .github-pr-preview-diff { --github-diff-addition-bg: #2ea04326; --github-diff-addition-fg: #3fb950; --github-diff-removal-bg: #f8514926; --github-diff-removal-fg: #ff7b72; --github-diff-hunk-bg: #1f6feb26; --github-diff-hunk-fg: #58a6ff; }
.github-pr-preview-dialog { border: 0; border-radius: 8px; box-shadow: 0 20px 60px #0008; max-width: min(1200px, 96vw); padding: 0; width: 100%; }
.github-pr-preview-dialog::backdrop { background: #0008; }
.github-pr-preview-shell { background: var(--color-bg, #fff); color: var(--color-text, #24292f); max-height: 90vh; overflow: auto; padding: 20px; }
.github-pr-preview-close { float: right; }
.github-pr-preview-header { align-items: start; display: flex; gap: 16px; justify-content: space-between; margin: 0 0 16px; }
.github-pr-preview-header h2 { font-size: 20px; margin: 0; }.github-pr-preview-header p { color: var(--color-text-secondary, #57606a); margin: 4px 0 0; }
.github-pr-preview-open-github { align-items: center; display: inline-flex; gap: 4px; }.github-pr-preview-open-github svg { fill: currentColor; height: 14px; width: 14px; }
.github-pr-preview-files { border: 1px solid var(--color-border, #d0d7de); margin-bottom: 16px; max-height: 160px; overflow: auto; padding: 8px; }.github-pr-preview-files a { display: block; font-family: monospace; font-size: 12px; padding: 2px; }
.github-pr-preview-file { margin: 0 0 24px; scroll-margin-top: 16px; }.github-pr-preview-file > header { background: var(--color-bg-secondary, #f6f8fa); border: 1px solid var(--color-border, #d0d7de); padding: 8px; }.github-pr-preview-file > header strong { font-family: monospace; font-size: 13px; margin-right: 12px; }
.github-pr-preview-additions { color: var(--color-success, #1a7f37); }.github-pr-preview-deletions { color: var(--color-danger, #cf222e); margin-left: 6px; }
.github-pr-preview-diff { border-collapse: collapse; font-family: monospace; font-size: 12px; width: 100%; }.github-pr-preview-diff td { padding: 0 6px; vertical-align: top; }.github-pr-preview-diff code { font: inherit; }.github-pr-preview-code { white-space: pre-wrap; word-break: break-all; }.github-pr-preview-number { color: var(--color-text-secondary, #57606a); padding: 0 3px !important; text-align: right; user-select: none; width: 32px; }.github-pr-preview-marker { padding: 0 3px !important; text-align: center; user-select: none; width: 12px; }
.github-pr-preview-addition { background: var(--github-diff-addition-bg); color: var(--github-diff-addition-fg); }.github-pr-preview-removal { background: var(--github-diff-removal-bg); color: var(--github-diff-removal-fg); }.github-pr-preview-hunk, .github-pr-preview-meta { background: var(--github-diff-hunk-bg); color: var(--github-diff-hunk-fg); }.github-pr-preview-comment-cell { padding: 0 !important; position: relative; width: 26px; }.github-pr-preview-comment-button { background: var(--color-primary, #0969da); border: 0; border-radius: 50%; color: #fff; cursor: pointer; display: none; height: 20px; position: absolute; right: 3px; top: 0; width: 20px; z-index: 1; }.github-pr-preview-line:hover .github-pr-preview-comment-button { display: block; }
.github-pr-preview-comment-form { background: var(--color-bg, #fff); border: 1px solid var(--color-border, #d0d7de); box-shadow: 0 3px 12px var(--color-shadow, #0003); display: none; padding: 6px; position: absolute; right: 0; top: 24px; width: 280px; z-index: 2; }.github-pr-preview-comment-form.is-open { display: block; }.github-pr-preview-comment-form textarea { background: var(--color-bg, #fff); border: 1px solid var(--color-border, #d0d7de); box-sizing: border-box; color: var(--color-text, #24292f); font: inherit; margin-bottom: 4px; resize: vertical; width: 100%; }.github-pr-preview-no-diff, .github-pr-preview-error { color: var(--color-text-secondary, #57606a); padding: 12px 0; }
.github-pr-preview-existing-comment td { background: var(--color-bg-secondary, #f6f8fa); }.github-pr-preview-comment { background: var(--color-bg, #fff); border: 1px solid var(--color-border, #d0d7de); border-radius: 6px; color: var(--color-text, #24292f); font-family: sans-serif; margin: 6px 0; padding: 8px; white-space: normal; }.github-pr-preview-comment header { align-items: center; display: flex; font-size: 12px; gap: 8px; margin-bottom: 6px; }.github-pr-preview-comment header div { display: flex; flex: 1; justify-content: space-between; }.github-pr-preview-comment time { color: var(--color-text-secondary, #57606a); }.github-pr-preview-avatar { border-radius: 50%; height: 24px; width: 24px; }.github-pr-preview-comment p { margin: 0; }.github-pr-preview-reply { margin-left: 24px; }.github-pr-preview-reply-form { display: none; margin-top: 6px; }.github-pr-preview-reply-form.is-open { display: block; }.github-pr-preview-reply-form textarea { background: var(--color-bg, #fff); border: 1px solid var(--color-border, #d0d7de); box-sizing: border-box; color: var(--color-text, #24292f); font: inherit; margin-bottom: 4px; resize: vertical; width: 100%; }.github-pr-preview-unmatched-comments { border-top: 1px solid var(--color-border, #d0d7de); padding: 6px; }
@media (max-width: 700px) { .github-pr-preview-shell { padding: 12px; }.github-pr-preview-dialog { max-width: 100vw; }.github-pr-preview-files { max-height: 96px; }.github-pr-preview-diff { font-size: 11px; }.github-pr-preview-header { align-items: stretch; flex-direction: column; }.github-pr-preview-comment-form { width: 220px; } }
</style>
<script>
(function() {
    function dialog() {
        let element = document.getElementById('github-pr-preview-dialog');
        if (element) return element;
        element = document.createElement('dialog');
        element.id = 'github-pr-preview-dialog';
        element.className = 'github-pr-preview-dialog';
        element.innerHTML = '<div class="github-pr-preview-shell"><button type="button" class="btn btn-secondary btn-small github-pr-preview-close">Close</button><div class="github-pr-preview-content"></div></div>';
        document.body.appendChild(element);
        return element;
    }

    function formatDates(container) {
        container.querySelectorAll('[data-github-pr-preview-date]').forEach(function(element) {
            const date = new Date(element.dateTime);
            if (!Number.isNaN(date.valueOf())) {
                element.textContent = new Intl.DateTimeFormat(undefined, {
                    dateStyle: 'medium', timeStyle: 'short'
                }).format(date);
            }
        });
    }

    document.addEventListener('click', function(event) {
        const openButton = event.target.closest('.github-pr-preview-open');
        if (openButton) {
            const element = dialog();
            const content = element.querySelector('.github-pr-preview-content');
            content.textContent = 'Loading diff...';
            element.showModal();
            fetch(openButton.dataset.previewUrl, {credentials: 'same-origin'})
                .then(function(response) { return response.text(); })
                .then(function(html) { content.innerHTML = html; formatDates(content); window.htmx.process(content); })
                .catch(function() { content.textContent = 'Could not load the pull request diff.'; });
            return;
        }
        const element = event.target.closest('#github-pr-preview-dialog');
        if (!element) return;
        if (event.target.matches('.github-pr-preview-close')) element.close();
        const commentButton = event.target.closest('.github-pr-preview-comment-button');
        if (commentButton) commentButton.nextElementSibling.classList.add('is-open');
        const cancelButton = event.target.closest('.github-pr-preview-cancel');
        if (cancelButton) cancelButton.closest('form').classList.remove('is-open');
        const replyButton = event.target.closest('.github-pr-preview-reply-button');
        if (replyButton) replyButton.nextElementSibling.classList.add('is-open');
    });

    document.body.addEventListener('githubPRPreviewToast', function(event) {
        const toast = event.detail.value || event.detail;
        window.showToast(toast.message, toast.type);
    });
})();
</script>
