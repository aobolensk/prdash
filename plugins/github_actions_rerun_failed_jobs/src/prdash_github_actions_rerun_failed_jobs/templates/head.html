<style>
.pr-ci-rerun-group {
    align-items: center;
    display: inline-flex;
}

.pr-ci-rerun-group .btn-icon-square {
    padding: 2px 6px;
}

.pr-ci-rerun {
    display: inline-flex;
}

.pr-ci-rerun-group .pr-ci-rerun button {
    border-bottom-right-radius: 0;
    border-top-right-radius: 0;
}

.pr-ci-rerun-dropdown {
    position: relative;
}

.pr-ci-rerun-dropdown-toggle {
    border-bottom-left-radius: 0;
    border-left: 0;
    border-top-left-radius: 0;
}

.pr-ci-rerun-dropdown-toggle.tracking {
    background-color: var(--color-primary);
    border-color: var(--color-primary);
    color: #fff;
}

.pr-ci-rerun-menu {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    box-shadow: 0 4px 16px var(--color-shadow);
    display: flex;
    flex-direction: column;
    min-width: 220px;
    padding: 4px;
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    z-index: 5;
}

.pr-ci-rerun-menu[hidden] {
    display: none;
}

.pr-ci-rerun-track-item,
.pr-ci-rerun-update-branch-item {
    background: none;
    border: 0;
    border-radius: 4px;
    color: var(--color-text);
    cursor: pointer;
    font: inherit;
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
    width: 100%;
}

.pr-ci-rerun-track-item:hover,
.pr-ci-rerun-update-branch-item:hover {
    background: var(--color-bg-secondary);
}

.pr-ci-rerun-track-item.tracking {
    color: var(--color-primary);
}

.pr-ci-rerun-spinner {
    border: 2px solid var(--color-border);
    border-radius: 50%;
    border-top-color: var(--color-primary);
    height: 12px;
    margin-right: 6px;
    width: 12px;
}

.pr-ci-rerun-spinner:not([hidden]) {
    animation: pr-ci-rerun-spin 0.8s linear infinite;
    display: inline-block;
}

.pr-ci-rerun-tracking-indicator {
    color: var(--color-success);
    margin-right: 6px;
}

.pr-ci-rerun-tracking-indicator:not([hidden]) {
    align-items: center;
    animation: pr-ci-rerun-pulse 2s ease-in-out infinite;
    display: flex;
}

@keyframes pr-ci-rerun-spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes pr-ci-rerun-pulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.5;
    }
}
</style>

<script
    src="{% url 'dashboard:plugin_asset' plugin_id='github-actions-rerun-failed-jobs' asset_name='rerun_failed_jobs.js' %}"
    defer></script>
