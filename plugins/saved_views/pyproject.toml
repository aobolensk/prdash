[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prdash-saved-views"
version = "1.0.0"
description = "Saved views for prdash"
requires-python = ">=3.12"

[project.entry-points."prdash.plugins"]
saved-views = "prdash_saved_views.plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prdash_saved_views = ["templates/*.html"]
