[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prdash-export-links"
version = "1.0.0"
description = "Export pull request links from prdash"
requires-python = ">=3.12"

[project.entry-points."prdash.plugins"]
export-links = "prdash_export_links.plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prdash_export_links = ["templates/*.html"]
