[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prdash-github-status"
version = "1.0.0"
description = "GitHub status tracking plugin for prdash"
requires-python = ">=3.12"
dependencies = ["requests>=2.33"]

[project.entry-points."prdash.plugins"]
github-status = "prdash_github_status.plugin:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prdash_github_status = ["templates/*.html"]
