<div class="preferences-form-wrapper">
    {% if success %}
    <div class="alert alert-success">Preferences saved!</div>
    {% endif %}

    <form hx-post="{% url 'dashboard:save_preferences' %}"
          hx-target="#preferences-form-container"
          hx-swap="innerHTML"
          class="preferences-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Auto-refresh tabs</label>
            <p class="form-help">Select which tabs should automatically refresh, and how often.</p>
            <div class="checkbox-group">
                {% for row in prefs.get_auto_refresh_rows %}
                {% include 'dashboard/partials/_auto_refresh_row.html' with row=row %}
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Save Preferences</button>
    </form>
</div>

<script>
(function() {
    document.querySelectorAll('.preferences-form [data-interval-toggle]').forEach(function(checkbox) {
        checkbox.addEventListener('change', function() {
            var target = document.querySelector('.interval-subfield[data-interval-for="' + this.getAttribute('data-interval-toggle') + '"]');
            if (target) {
                target.hidden = !this.checked;
            }
        });
    });
})();
</script>
