repos:
  - repo: https://github.com/djlint/djLint
    rev: v1.46.6
    hooks:
      - id: djlint-django
        args: [--lint, "--ignore=H021,H023,T002"]
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8 .
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: eslint --no-warn-ignored
        language: node
        additional_dependencies:
          - eslint@^9
          - eslint-plugin-html@^8
          - globals@^15
          - "@eslint/js@^9"
        types_or: [javascript, html]
        exclude: '\.min\.js$'
        pass_filenames: true
